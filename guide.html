<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>看懂配置 · 芯片天梯与术语</title>
<style>
:root{
  --ink:#07080e; --ink2:#0c0e17;
  --glass:rgba(255,255,255,.045); --glass-hi:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.10); --txt:#f5f6fb; --dim:#aab2c6; --dimmer:#8b94ab;
  --gold:#ffc861; --sky:#6aa8ff; --ok:#3ddc97; --warn:#ffb020; --bad:#ff6b5e;
  --r:16px; --shadow:0 16px 40px -18px rgba(0,0,0,.8);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--txt);line-height:1.55;min-height:100vh;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif}
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(900px 520px at 10% -8%,rgba(255,200,97,.13),transparent 60%),
  radial-gradient(820px 500px at 92% 4%,rgba(106,168,255,.12),transparent 58%),
  linear-gradient(180deg,var(--ink),var(--ink2) 55%,var(--ink))}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 64px}
header{padding:26px 26px 22px;margin-bottom:18px;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,200,97,.12),rgba(106,168,255,.05) 55%,rgba(255,255,255,.02));
  border:1px solid var(--line);box-shadow:var(--shadow)}
header h1{font-size:26px;letter-spacing:.5px}
header .sub{color:var(--dim);font-size:13.5px;margin-top:7px}
.nav{display:inline-block;margin-top:12px;padding:7px 13px;border-radius:999px;font-size:12.5px;
  text-decoration:none;background:var(--glass);border:1px solid var(--line);color:var(--dim)}
.nav:hover{color:var(--txt);border-color:var(--gold)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;letter-spacing:.6px;color:var(--gold);margin-bottom:6px;font-weight:600}
.card h2 + .lead{font-size:12.5px;color:var(--dimmer);margin-bottom:14px}

/* 天梯 */
.ladder{display:flex;flex-direction:column;gap:9px}
.rung{display:grid;grid-template-columns:34px minmax(150px,220px) 1fr;gap:12px;align-items:center}
.rung .no{font-size:12.5px;color:var(--dimmer);text-align:right}
.rung .who{font-size:13.5px;font-weight:600}
.rung .who small{display:block;font-weight:400;font-size:11.5px;color:var(--dimmer);margin-top:2px}
.bar{position:relative;min-height:44px;border-radius:10px;background:rgba(255,255,255,.035);
  border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;gap:6px;
  padding:7px 10px;flex-wrap:wrap}
.bar i{position:absolute;left:0;top:0;bottom:0;z-index:0;opacity:.16}
.bar .m{position:relative;z-index:1;font-size:11.5px;padding:2px 8px;border-radius:7px;
  background:rgba(7,8,14,.62);border:1px solid rgba(255,255,255,.14);color:var(--txt);white-space:nowrap}
.bar .m b{color:var(--gold);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--dimmer)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:22px;height:9px;border-radius:3px;display:inline-block;opacity:.55}

/* 术语 */
.grp{margin:22px 0 10px;font-size:13px;color:var(--sky);letter-spacing:.5px;
  border-bottom:1px solid var(--line);padding-bottom:6px}
.grp:first-of-type{margin-top:0}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:12px}
.gc{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
.gc h3{font-size:14px;font-weight:600;margin-bottom:7px}
.gc p{font-size:12.8px;color:var(--dim);margin-bottom:7px}
.gc p.why{color:var(--txt)}
.gc p.why b{color:var(--gold);font-weight:600}
.gc .look{font-size:11.5px;color:var(--dimmer);border-top:1px dashed var(--line);padding-top:7px;margin-bottom:0!important}
footer{margin-top:24px;font-size:12px;color:var(--dimmer);text-align:center}
@media (max-width:640px){
  .rung{grid-template-columns:26px 1fr;gap:8px}
  .rung .bar{grid-column:1 / -1;height:auto;min-height:40px;padding:6px 8px}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">

<header>
  <h1>看懂配置</h1>
  <div class="sub">不用记名字。先看芯片天梯知道「谁比谁快、快出来那一千块值不值」，再查下面那批词 —— 只收选手机这一页真会撞上的说法。</div>
  <a class="nav" href="index.html">← 回到「按分数给预算」</a>
</header>

<section class="card">
  <h2>芯片天梯：这 31 台里谁快谁慢</h2>
  <div class="lead" id="basis"></div>
  <div class="ladder" id="ladder"></div>
  <div class="legend">
    <span><em style="background:var(--gold)"></em>1–4 档：旗舰，你玩不出差别</span>
    <span><em style="background:var(--sky)"></em>5–7 档：次旗舰，日常完全够</span>
    <span><em style="background:var(--dimmer)"></em>8–10 档：中端，大型游戏要降画质</span>
  </div>
</section>

<section class="card">
  <h2>术语：这些词在说什么</h2>
  <div class="lead" id="gnote"></div>
  <div id="gloss"></div>
</section>

<footer id="stamp"></footer>
</div>
<script src="phones.js"></script>
<script src="guide.js"></script>
</body>
</html>
